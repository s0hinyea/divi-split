<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Divi - Payment Request</title>

    <!-- Open Graph (iMessage, WhatsApp, Slack previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Divi" />
    <meta property="og:title"       content="Payment Request" />
    <meta property="og:description" content="Someone sent you a payment request via Divi." />
    <meta property="og:image"       content="https://divi-split.netlify.app/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / iMessage fallback -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Payment Request" />
    <meta name="twitter:description" content="Someone sent you a payment request via Divi." />
    <meta name="twitter:image"       content="https://divi-split.netlify.app/og-image.png" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5F5F5;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }
        .page-header {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
            text-align: center;
        }
        .page-title {
            font-family: 'Inter', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: #111111;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }
        .page-title .green { color: #00C37F; }
        .page-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 400;
            color: #888;
            margin-top: 4px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .from-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
        }
        .from-name { font-size: 20px; font-weight: 700; color: #111; }
        .from-sub { font-size: 13px; color: #666; margin-top: 2px; }
        .divider { height: 1px; background: #F0F0F0; margin: 16px 0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 6px 0; font-size: 14px; color: #444; }
        td.price { text-align: right; font-weight: 600; color: #111; white-space: nowrap; }
        .total-row { font-size: 18px; font-weight: 800; color: #00C37F; }
        .total-row td { padding-top: 10px; }

        /* Aggregate receipt section label */
        .receipt-label {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }
        .receipt-subtotal {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #F0F0F0;
        }
        .receipt-section { margin-bottom: 16px; }
        .receipt-section:last-child { margin-bottom: 0; }

        .payment-section { width: 100%; max-width: 420px; margin-bottom: 4px; }
        .section-label {
            font-size: 11px; color: #999;
            text-transform: uppercase; letter-spacing: 0.6px;
            margin-bottom: 10px;
        }
        .pay-btn {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 16px 20px;
            border-radius: 14px; font-size: 15px; font-weight: 700;
            text-decoration: none; margin-bottom: 10px;
            transition: opacity 0.15s;
        }
        .pay-btn:active { opacity: 0.75; }
        .pay-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
        .venmo { background: #3D95CE; color: #fff; }
        .cashapp { background: #00C244; color: #fff; }
        .zelle-block {
            background: #fff; border-radius: 14px;
            padding: 16px 20px; margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .zelle-label { font-size: 12px; color: #999; margin-bottom: 4px; }
        .zelle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .zelle-number { font-size: 17px; font-weight: 700; color: #6D1ED4; }
        .zelle-copy-btn {
            background: none; border: 1.5px solid #6D1ED4; border-radius: 8px;
            color: #6D1ED4; font-size: 13px; font-weight: 600;
            padding: 6px 14px; cursor: pointer; flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .zelle-copy-btn:active, .zelle-copy-btn.copied {
            background: #6D1ED4; color: #fff;
        }
        .sent-btn {
            display: block; width: 100%; max-width: 420px;
            margin-top: 20px; padding: 18px;
            background: #111; color: #fff; border: none;
            border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: opacity 0.15s;
        }
        .sent-btn:active { opacity: 0.75; }
        .sent-btn:disabled { background: #ccc; cursor: default; }
        .already-msg {
            margin-top: 20px; padding: 16px 20px;
            background: #E8F8EE; border-radius: 14px;
            color: #00C37F; font-size: 14px; font-weight: 600;
            text-align: center; width: 100%; max-width: 420px;
        }
        .note {
            font-size: 12px; color: #bbb;
            text-align: center; margin-top: 16px; max-width: 320px;
        }
        #root {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .loading {
            margin-top: 60px; font-size: 15px; color: #999; text-align: center;
        }
        .error-msg {
            margin-top: 60px; font-size: 15px; color: #E53935; text-align: center;
        }
        td.item-name {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="pageHeader" class="page-header" style="display:none;">
        <div class="page-title">Hello, <span class="green" id="headerName"></span></div>
        <div class="page-subtitle">Here's what you owe.</div>
    </div>
    <div id="root"><p class="loading">Loading...</p></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL  = 'https://ejfmhukphszhowutctly.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZm1odWtwaHN6aG93dXRjdGx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MDQ0MjQsImV4cCI6MjA4NTM4MDQyNH0.xZUxA9sb-A3eaDW7WIJ55zPlf0JGngNNss3W17WiQYQ';
        const EDGE_FN_URL   = `${SUPABASE_URL}/functions/v1/pay`;

        const db = createClient(SUPABASE_URL, SUPABASE_ANON);
        const root = document.getElementById('root');

        const params = new URLSearchParams(location.search);
        // Support single ?token= (existing) and aggregate ?tokens=a,b,c
        const tokensParam = params.get('tokens');
        const tokenParam  = params.get('token');
        const tokens = tokensParam
            ? tokensParam.split(',').map(t => t.trim()).filter(Boolean)
            : tokenParam ? [tokenParam] : [];

        function esc(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function load() {
            if (tokens.length === 0) {
                root.innerHTML = '<p class="error-msg">Invalid link.</p>';
                return;
            }

            const results = await Promise.all(
                tokens.map(t => db.rpc('get_pay_page_data', { p_token: t }))
            );

            const payloads = results.map(r => r.data).filter(Boolean);
            if (payloads.length === 0) {
                root.innerHTML = '<p class="error-msg">Payment request not found.</p>';
                return;
            }

            const first = payloads[0];
            const { contact_name, owner_name, venmo, cashapp, zelle } = first;
            const isAggregate = payloads.length > 1;

            const grandTotal = payloads.reduce((s, p) => s + Number(p.amount), 0);
            const alreadyPaid = payloads.every(p => p.status === 'settled' || p.status === 'pending');

            document.title = `Divi: Pay ${esc(owner_name)}`;
            document.getElementById('headerName').textContent = contact_name;
            document.getElementById('pageHeader').style.display = 'block';

            // Build item section(s)
            let itemsHtml = '';
            if (isAggregate) {
                payloads.forEach((p, i) => {
                    const rows = (p.items ?? []).map(item =>
                        `<tr><td class="item-name">${esc(item.name)}</td><td class="price">$${Number(item.price).toFixed(2)}</td></tr>`
                    ).join('');
                    itemsHtml += `
                        <div class="receipt-section">
                            <div class="receipt-label">Receipt ${i + 1}</div>
                            <table>${rows}</table>
                            <div class="receipt-subtotal">
                                <span>Subtotal</span>
                                <span>$${Number(p.amount).toFixed(2)}</span>
                            </div>
                        </div>
                        ${i < payloads.length - 1 ? '<div class="divider"></div>' : ''}
                    `;
                });
                itemsHtml += `
                    <div class="divider"></div>
                    <table>
                        <tr class="total-row">
                            <td>Total (${payloads.length} receipts)</td>
                            <td class="price">$${grandTotal.toFixed(2)}</td>
                        </tr>
                    </table>
                `;
            } else {
                const rows = (first.items ?? []).map(item =>
                    `<tr><td class="item-name">${esc(item.name)}</td><td class="price">$${Number(item.price).toFixed(2)}</td></tr>`
                ).join('');
                itemsHtml = `
                    <table>
                        ${rows}
                        <tr class="total-row">
                            <td>Total</td>
                            <td class="price">$${grandTotal.toFixed(2)}</td>
                        </tr>
                    </table>
                `;
            }

            // Build pay buttons using grand total
            let payButtons = '';
            if (venmo) {
                const handle = String(venmo).replace('@', '');
                const note = encodeURIComponent(`Divi: $${grandTotal.toFixed(2)}`);
                payButtons += `<a href="venmo://paycharge?txn=pay&recipients=${encodeURIComponent(handle)}&amount=${grandTotal.toFixed(2)}&note=${note}" class="pay-btn venmo">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 2c.5 1.2.7 2.4.7 3.9 0 4.9-4.2 11.2-7.6 15.7H5.3L2 4l6.5-.6 1.7 13.4c1.6-2.6 3.5-6.7 3.5-9.5 0-1.5-.3-2.5-.7-3.4L19.4 2z"/></svg>
                    Pay with Venmo
                </a>`;
            }
            if (cashapp) {
                const handle = String(cashapp).replace('$', '');
                payButtons += `<a href="https://cash.app/$${encodeURIComponent(handle)}/${grandTotal.toFixed(2)}" class="pay-btn cashapp">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.2 7.2l-.7-2.6A7 7 0 0 0 12 3a7 7 0 0 0-7 7c0 3.1 2 5.8 4.9 6.7l.7 2.6A1 1 0 0 0 11.5 20h1a1 1 0 0 0 1-.8l.7-2.6A7 7 0 0 0 19 10a7 7 0 0 0-1.8-2.8zM12 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
                    Pay with Cash App
                </a>`;
            }
            if (zelle) {
                payButtons += `<div class="zelle-block">
                    <p class="zelle-label">Pay with Zelle</p>
                    <div class="zelle-row">
                        <p class="zelle-number" id="zelleNumber">${esc(zelle)}</p>
                        <button class="zelle-copy-btn" id="zelleCopyBtn" onclick="copyZelle()">Copy</button>
                    </div>
                </div>`;
            }

            root.innerHTML = `
                <div class="card">
                    <div class="from-label">Requested by</div>
                    <div class="from-name">${esc(owner_name)}</div>
                    <div class="divider"></div>
                    ${itemsHtml}
                </div>

                ${payButtons ? `<div class="payment-section"><div class="section-label">Pay via</div>${payButtons}</div>` : ''}

                ${alreadyPaid
                    ? `<div class="already-msg">Payment confirmed. Thanks!</div>`
                    : `<button class="sent-btn" id="sentBtn">I sent it</button>
                       <p class="note">Tap after sending payment. ${esc(owner_name)} will confirm.</p>`
                }
            `;

            if (!alreadyPaid) {
                document.getElementById('sentBtn').addEventListener('click', markSent);
            }
        }

        async function markSent() {
            const btn = document.getElementById('sentBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await Promise.all(
                    tokens.map(t =>
                        fetch(`${EDGE_FN_URL}?token=${encodeURIComponent(t)}`, { method: 'POST' })
                    )
                );
                btn.textContent = 'Sent!';
                btn.style.background = '#00C37F';
            } catch {
                btn.disabled = false;
                btn.textContent = 'I sent it';
                alert('Something went wrong. Please try again.');
            }
        }

        // Must be on window so inline onclick in dynamically inserted HTML can reach it
        window.copyZelle = function() {
            const btn = document.getElementById('zelleCopyBtn');
            const num = document.getElementById('zelleNumber')?.textContent?.trim() ?? '';
            if (!num) return;

            const finish = () => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(num).then(finish).catch(() => fallbackCopy(num, finish));
            } else {
                fallbackCopy(num, finish);
            }
        };

        function fallbackCopy(text, onSuccess) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                onSuccess();
            } catch (_) {}
            document.body.removeChild(ta);
        }

        load();

    </script>
</body>
</html>
